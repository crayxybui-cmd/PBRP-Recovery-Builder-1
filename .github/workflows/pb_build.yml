- name: 💾 RAM Kapasitesini Artır (10GB Swap Ekle)
      run: |
        echo "Swap alanı oluşturuluyor..."
        # Çakışmayı önlemek için swapfile_extra adını kullanıyoruz
        # fallocate başarısız olursa otomatik olarak dd komutu devreye girer
        sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
        sudo chmod 600 /swapfile_extra
        sudo mkswap /swapfile_extra
        sudo swapon /swapfile_extra
        echo "Mevcut Bellek ve Swap Durumu:"
        free -h
