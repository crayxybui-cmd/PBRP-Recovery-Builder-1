name: PBRP Recovery Build for Samsung A71

on:
  workflow_dispatch:

# Tüm ayarları buradan kolayca değiştirebilirsin
env:
  MANIFEST_URL: https://github.com/PitchBlackRecoveryProject/manifest_pb
  MANIFEST_BRANCH: android-11.0
  DEVICE_TREE_URL: https://github.com/ianmacd/twrp_a71.git
  DEVICE_PATH: device/samsung/a71
  DEVICE_NAME: a71

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 🧹 Sistem Temizliği (Maksimum Depolama Alanı Aç)
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
        sudo docker image prune --all --force
        sudo apt-get clean

    - name: 📥 Depoyu Klonla
      uses: actions/checkout@v4

    - name: ⚙️ Derleme Ortamını Hazırla (Donma Korumalı)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -yq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: 🚀 Ccache (Derleme Hızlandırıcı) Aktifleştir
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: pbrp-ccache-${{ github.sha }}
        restore-keys: |
          pbrp-ccache-

    - name: 🔄 PBRP Kaynak Kodlarını Çek
      run: |
        mkdir pbrp
        cd pbrp
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)

    - name: 🌳 A71 Cihaz Ağacını Ekle
      run: |
        cd pbrp
        git clone ${{ env.DEVICE_TREE_URL }} ${{ env.DEVICE_PATH }}

    - name: 🛠️ Akıllı Derleme (Hata Yakalama ve Otomatik Hedef)
      run: |
        cd pbrp
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        source build/envsetup.sh

        # Cihaz ağacındaki doğru derleme hedefini (lunch) otomatik bul
        if [ -f ${{ env.DEVICE_PATH }}/omni_${{ env.DEVICE_NAME }}.mk ]; then
          echo "omni_${{ env.DEVICE_NAME }} hedefi bulundu."
          lunch omni_${{ env.DEVICE_NAME }}-eng
        elif [ -f ${{ env.DEVICE_PATH }}/twrp_${{ env.DEVICE_NAME }}.mk ]; then
          echo "twrp_${{ env.DEVICE_NAME }} hedefi bulundu."
          lunch twrp_${{ env.DEVICE_NAME }}-eng
        else
          echo "FATAL ERROR: Cihaz ağacında geçerli bir .mk dosyası bulunamadı!"
          exit 1
        fi

        make clean && make clobber

        # Derlemeyi başlat ve tüm logu aynı anda 'build_log.txt' dosyasına kaydet
        mka recoveryimage -j$(nproc --all) | tee build_log.txt

        # Dosyanın gerçekten üretilip üretilmediğini kontrol et
        if [ ! -f out/target/product/${{ env.DEVICE_NAME }}/recovery.img ]; then
          echo "FATAL ERROR: mka recoveryimage tamamlandı ancak recovery.img üretilmedi!"
          exit 1
        fi

    - name: 📄 Derleme Hatası Logunu Yükle (Sadece Hata Verirse Çalışır)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Error-Log
        path: pbrp/build_log.txt

    - name: 📦 Çıktıları Doğrula ve Profesyonel Paketle
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/output
        cd pbrp/out/target/product/${{ env.DEVICE_NAME }}/
        
        # Dinamik isimlendirme (Örn: PBRP-A71-Unofficial-20260919.zip)
        DATE=$(date +%Y%m%d)
        ZIP_NAME="PBRP-A71-Unofficial-${DATE}.zip"
        
        if ls PBRP*.zip 1> /dev/null 2>&1; then
          cp PBRP*.zip ${GITHUB_WORKSPACE}/output/${ZIP_NAME}
        elif [ -f "recovery.img" ]; then
          zip -j ${GITHUB_WORKSPACE}/output/${ZIP_NAME} recovery.img
        else
          echo "Paketlenecek dosya bulunamadı!"
          exit 1
        fi
        
        # Diğer adımlar için dosya yolunu kaydet
        echo "ZIP_PATH=${GITHUB_WORKSPACE}/output/${ZIP_NAME}" >> $GITHUB_ENV
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

    - name: 💾 Artifact Olarak Yükle (İndirme Linki Oluştur)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_PATH }}

    - name: 🌐 Release Olarak Yayımla
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_PATH }}
        tag_name: PBRP-${{ github.run_number }}-A71
        name: PBRP Unofficial Build - Samsung Galaxy A71
        body: |
          🚀 **Samsung Galaxy A71** için otomatik derlenmiş PitchBlack Recovery projesi.
          
          **Derleme Bilgileri:**
          * 🌳 **Cihaz Ağacı:** ianmacd/twrp_a71
          * 🤖 **Android Sürümü:** 11.0 
          * ⚡ Ccache hızlandırması kullanılarak derlendi.
          
          *Not: Lütfen kurmadan önce (Odin, Heimdall veya FastbootD üzerinden flaşlamadan önce) mevcut sisteminizin yedeğini alın!*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
