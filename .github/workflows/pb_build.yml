name: PBRP Recovery Build for Samsung A71

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Derleme Ortamını Hazırla
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: PBRP Kaynak Kodlarını Çek
      run: |
        mkdir pbrp
        cd pbrp
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-11.0
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)

    - name: A71 Cihaz Ağacını Ekle
      run: |
        cd pbrp
        git clone https://github.com/ianmacd/twrp_a71.git device/samsung/a71

    - name: PBRP Betiği ile Derle
      run: |
        cd pbrp
        source build/envsetup.sh
        lunch omni_a71-eng
        # PBRP'nin dahili Python/Shell derleme betiğini çalıştır
        if [ -f "vendor/pb/tools/build.py" ]; then
          python3 vendor/pb/tools/build.py a71 -p
        elif [ -f "vendor/pb/tools/build.sh" ]; then
          bash vendor/pb/tools/build.sh a71
        else
          mka pbrp -j$(nproc --all) || mka recoveryimage -j$(nproc --all)
        fi 2>&1 | tee build.log || true

    - name: Derleme Çıktılarını Doğrula ve Sıkıştır
      run: |
        cd pbrp
        echo "=== Üretilen PBRP Dosyaları ==="
        find out/target/product/a71/ -name "PBRP*.zip" -o -name "recovery.img" || true
        
        # PBRP'nin kendi oluşturduğu installer zip'i veya recovery.img'yi bul ve paketle
        ZIP_FILE=$(find out/target/product/a71/ -name "PBRP*.zip" | head -n 1)
        IMG_FILE=$(find out/target/product/a71/ -name "recovery.img" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          cp "$ZIP_FILE" out/target/product/a71/pbrp_a71_build.zip
        elif [ -n "$IMG_FILE" ]; then
          cd out/target/product/a71/
          zip -r pbrp_a71_build.zip recovery.img
        else
          echo "=== Derleme Log Özeti ==="
          tail -n 100 build.log
          exit 1
        fi

    - name: Release Olarak Yayımla
      uses: softprops/action-gh-release@v2
      with:
        files: pbrp/out/target/product/a71/pbrp_a71_build.zip
        tag_name: v1.0-a71
        name: PBRP Unofficial Build - Samsung Galaxy A71
        body: |
          Samsung Galaxy A71 için PBRP betiği kullanılarak GitHub Actions üzerinden otomatik derlenen imaj.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
