name: PBRP Recovery Build for Samsung A71

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Derleme Ortamını Hazırla
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: PBRP Kaynak Kodlarını Çek
      run: |
        mkdir pbrp
        cd pbrp
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-11.0
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)

    - name: A71 Cihaz Ağacını Ekle
      run: |
        cd pbrp
        git clone https://github.com/ianmacd/twrp_a71.git device/samsung/a71

    - name: PBRP Betiği ile Derle
      run: |
        cd pbrp
        source build/envsetup.sh
        lunch omni_a71-eng
        if [ -f "vendor/pb/tools/build.py" ]; then
          python3 vendor/pb/tools/build.py a71 -p
        elif [ -f "vendor/pb/tools/build.sh" ]; then
          bash vendor/pb/tools/build.sh a71
        else
          mka pbrp -j$(nproc --all) || mka recoveryimage -j$(nproc --all)
        fi

    - name: Derleme Çıktılarını Pakatle
      run: |
        cd pbrp/out/target/product/a71/
        echo "=== Üretilen Tüm Dosyalar ==="
        ls -lh
        
        # PBRP Zip veya img dosyalarını zip içine ekle
        mkdir -p ~/output/
        if ls PBRP*.zip 1> /dev/null 2>&1; then
          cp PBRP*.zip ~/output/pbrp_a71_build.zip
        elif [ -f "recovery.img" ]; then
          zip -r ~/output/pbrp_a71_build.zip recovery.img
        elif [ -f "boot.img" ]; then
          zip -r ~/output/pbrp_a71_build.zip boot.img
        else
          echo "Bütün imaj dosyaları taranıyor..."
          zip -r ~/output/pbrp_a71_build.zip *.img
        fi

    - name: Release Olarak Yayımla
      uses: softprops/action-gh-release@v2
      with:
        files: /home/runner/output/pbrp_a71_build.zip
        tag_name: v1.0-a71
        name: PBRP Unofficial Build - Samsung Galaxy A71
        body: |
          Samsung Galaxy A71 (omni_a71) için otomatik derlenen PBRP recovery paketi.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
